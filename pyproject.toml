# Tool configuration only: this repository is an application, not an installable package, so there is
# deliberately no [project] table. Dependencies live in requirements*.txt and constraints.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# The checks that find real defects: syntax errors and pyflakes (undefined names, unused imports/variables).
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests import pytest fixtures by name and use them as arguments, which pyflakes reports as redefinition.
"tests/**" = ["F811", "F401"]
